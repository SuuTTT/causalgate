_base_: warn2trade.yaml
# same encoder + quantile forecaster, no anomaly label anywhere, closed-form Kelly/CVaR rule
model:
  tag: direct_quantile_kelly
  ablation: {label_free: true, plugin_policy: true}
  policy: {a_min: 0.0}
train:
  stages:
    - {name: extrap, modules: [detector, extrapolator], epochs: 10, lr: 5.0e-4, losses: {imp: 1.0, liq: 0.5}}
