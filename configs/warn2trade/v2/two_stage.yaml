_base_: warn2trade.yaml
# no end-to-end stage; policy gets the e2e epochs instead (same budget)
model:
  tag: two_stage
  ablation: {}
train:
  stages:
    - {name: detect, modules: [detector], epochs: 4, lr: 3.0e-4, losses: {det: 1.0, dir: 1.0, svdd: 0.1}}
    - {name: extrap, modules: [detector, extrapolator], epochs: 6, lr: 5.0e-4, losses: {det: 1.0, dir: 1.0, imp: 1.0, liq: 0.5, peak: 0.5}}
    - {name: policy, modules: [policy], epochs: 10, lr: 1.0e-3, detach_upstream: true, losses: {utility: 1.0, turnover: 0.001}}
