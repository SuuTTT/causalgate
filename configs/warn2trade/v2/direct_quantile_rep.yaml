_base_: warn2trade.yaml
# no anomaly label, learned policy, same budget
model:
  tag: direct_quantile_rep
  ablation: {label_free: true}
train:
  stages:
    - {name: extrap, modules: [detector, extrapolator], epochs: 10, lr: 5.0e-4, losses: {imp: 1.0, liq: 0.5}}
    - {name: policy, modules: [policy], epochs: 6, lr: 1.0e-3, detach_upstream: true, losses: {utility: 1.0, turnover: 0.001}}
    - {name: e2e, modules: [detector, extrapolator, policy], epochs: 4, lr: 1.0e-4, losses: {imp: 1.0, liq: 0.5, utility: 1.0, turnover: 0.001}}
