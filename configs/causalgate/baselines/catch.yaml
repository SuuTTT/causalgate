# B7 CATCH (Wu et al., ICLR 2025) - causalgate/baselines/b7_catch.py, registered as cg_catch.
baseline: cg_catch
mode: causal
published_threshold: combined_quantile  # official CATCH.py detect_label: np.percentile(train+test energy, 100 - ratio) per ratio
anomaly_ratio: 0.05                   # official default list [0.1 .. 25] %; the MSL detect_label script passes 5.0 %
published_norm: train                 # official: StandardScaler fitted on the first 80 % of the train split; RevIN per window inside
lookback: 96                          # official seq_len 192
latency: 1
hold_index: 2
n_exec: 4
w_max: 1.0
bars_per_year: 252
normaliser: {mode: welford, warmup: 60}
gate: {type: delayed_aci, alpha: 0.05, gamma: 0.02, window: 500}
model:
  patch_size: 16                      # official 16
  patch_stride: 8                     # official 8
  d_model: 64                         # official d_model 128-256, cf_dim 32-64
  n_heads: 2                          # official 1-2
  e_layers: 2                         # official 3
  d_ff: 128                           # official 256
  dropout: 0.05
  head_dropout: 0.1
  auxi_lambda: 0.005                  # official default 0.005 (MSL script 0.05)
  dc_lambda: 0.005                    # official default (only used with the official Trans_C module; the fallback has no dcloss)
  epochs: 3                           # official 3-5 with early stopping (patience 3) on a 20 % validation split
  lr: 5.0e-4                          # official scripts 5e-4
  Mlr: 1.0e-5                         # official mask-generator learning rate
  batch_size: 128
  seed: 0
  use_official: true                  # use third_party/CATCH (ts_benchmark package) when importable
smoke:
  lookback: 48
  model: {patch_size: 8, patch_stride: 8, d_model: 16, n_heads: 2, e_layers: 1, d_ff: 32, epochs: 1, lr: 1.0e-3, batch_size: 256}
