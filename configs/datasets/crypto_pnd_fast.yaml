# crypto_pnd with sweep-sized settings (3-month test windows, 5% unlabelled sample, 7 epochs). Same data and anchors.
experiment: {name: crypto_pnd}
dataset:
  name: daily_bars
  path: data/crypto/bars_1h.csv
  market: crypto
  bars_per_year: 8760
  floor: h
  start: "2018-01-01"
  min_obs: 2000
  capital_per_slot: 0.5
  hs_k: 0.02
  hs_min: 0.0005
  rule_horizon: 3
  anchors: {path: data/crypto/pnd_anchors.csv}
label_budget: {lead: 3, neg_margin: 48, n_cal: 0.1, cal_block: 24}
splits: {train: 4380, val: 720, test: 2190, step: 2190, purge: 30, embargo: 24, max_folds: null}
data: {lookback: 48, unlabeled_subsample: 0.05, batch_size: 512}
train: {epochs_ssl: 1, epochs_warm: 1, epochs_semi: 3, epochs_joint: 2, trade_ramp_epochs: 1}
eval: {borrow_bps_annual: 1000, hold_h: 3, overlay_hold: 6, min_val_events: 3, n_perm: 100, n_boot: 300}
backtest: {bps_grid: [5, 15, 30]}
experiment_device: cpu
