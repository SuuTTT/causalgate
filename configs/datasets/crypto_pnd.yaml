# Overlay (no _base_): Telegram-announced pump-and-dumps on Binance SYM/BTC (La Morgia et al., ICCCN 2020; 513 cases with
# Binance Vision hourly bars, 84 coins). Label-rich control: the "case" is public at the pump hour (release = peak), so the
# release protocol only hides future pumps. Built by scripts/data_fetch/fetch_binance_pnd.py on c225.
experiment: {name: crypto_pnd}
dataset:
  name: daily_bars                  # generic long-table builder; hourly bars here
  path: data/crypto/bars_1h.csv
  market: crypto
  bars_per_year: 8760
  floor: h
  start: "2018-01-01"
  min_obs: 2000
  capital_per_slot: 0.5             # BTC per coin slot (quote volume is in BTC)
  hs_k: 0.02
  hs_min: 0.0005
  rule_horizon: 3
  anchors: {path: data/crypto/pnd_anchors.csv}
label_budget: {lead: 3, neg_margin: 48, n_cal: 0.1, cal_block: 24, k_values: [1, 2, 3, 5, 10, 30, null]}
splits: {train: 4380, val: 720, test: 1460, step: 1460, purge: 30, embargo: 24, max_folds: null}
data: {lookback: 48, unlabeled_subsample: 0.15, batch_size: 512}
eval: {borrow_bps_annual: 1000, hold_h: 3, overlay_hold: 6, min_val_events: 3}
